name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Expose Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      # البحث عن ملف gradlew في أي مجلد فرعي ومنحه الصلاحيات وبناؤه تلقائياً
      - name: Find and Build APK with Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
          
          # نسخ ملف الـ APK الناتج إلى مسار ثابت لرفع الـ Artifact
          mkdir -p ../output-apk
          find . -name "app-debug.apk" -exec cp {} ../output-apk/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: output-apk/*.apk
