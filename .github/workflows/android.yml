name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (Java 17 أو أحدث حسب متطلبات مشروعك)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. إعداد Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. منح صلاحيات التشغيل لملف Gradlew (مهم جداً لنظام لينكس)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. بناء التطبيق (Debug APK) باستخدام Gradle Wrapper الموجود في المشروع
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug

      # 6. رفع ملف الـ APK الناتج ليكون متاحاً للتحميل من الـ Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
