
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract ZIP if needed
        shell: bash
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE" \
            -name settings.gradle.kts \
            -not -path '*/.gradle/*' \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -name '*.zip' -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "Project ZIP or Gradle project not found!"
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/android-project"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/android-project"

            PROJECT_DIR=$(find "$RUNNER_TEMP/android-project" \
              -name settings.gradle.kts -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not locate Android project!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sadaqa-Jariya-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
