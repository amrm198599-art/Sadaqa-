name: Build APK and AAB from ZIP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Extract ZIP and Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Expose Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Extract and Build Automatically
        run: |
          echo "=== Extracting ZIP ==="
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          unzip -q "$ZIP_FILE" -d extracted_project
          
          echo "=== Finding project directory ==="
          # البحث تلقائياً عن مجلد يحتوي على ملف build.gradle أو build.gradle.kts
          BUILD_FILE=$(find extracted_project -name "build.gradle*" -type f -print -quit)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: Android build file not found in extracted contents!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found project directory at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          
          echo "=== Generating Gradle Wrapper ==="
          gradle wrapper --gradle-version 8.9
          
          chmod +x gradlew
          
          echo "=== Building Debug APK ==="
          ./gradlew assembleDebug
          
          echo "=== Building Release AAB ==="
          ./gradlew bundleRelease
          
          mkdir -p ../../final-outputs
          find . -name "app-debug.apk" -exec cp {} ../../final-outputs/ \;
          find . -name "app-release.aab" -exec cp {} ../../final-outputs/ \;

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-and-aab
          path: final-outputs/*
