name: Build APK and AAB from ZIP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Extract ZIP and Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Expose Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Inspect and Build from ZIP
        run: |
          echo "=== Checking files in root ==="
          ls -la
          
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No ZIP file found!"
            exit 1
          fi
          
          echo "=== Extracting $ZIP_FILE ==="
          unzip -q "$ZIP_FILE" -d extracted_project
          
          echo "=== Contents of extracted folder ==="
          find extracted_project -maxdepth 3
          
          # محاولة البحث عن مجلد المشروع أو الـ gradlew بشكل أعمق
          GRADLEW_PATH=$(find extracted_project -name "gradlew" -type f -print -quit)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew is still missing inside the ZIP contents!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          
          echo "=== Building Debug APK ==="
          ./gradlew assembleDebug
          
          echo "=== Building Release AAB ==="
          ./gradlew bundleRelease
          
          mkdir -p ../../final-outputs
          find . -name "app-debug.apk" -exec cp {} ../../final-outputs/ \;
          find . -name "app-release.aab" -exec cp {} ../../final-outputs/ \;

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-and-aab
          path: final-outputs/*
