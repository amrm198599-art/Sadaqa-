name: Build APK and AAB from ZIP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Extract ZIP and Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Expose Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Unzip Project and Build
        run: |
          echo "Checking available ZIP files..."
          ls -la
          
          # البحث عن ملف الـ ZIP الموجود في المستودع وفكه
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No ZIP file found in repository root!"
            exit 1
          fi
          
          echo "Extracting $ZIP_FILE..."
          unzip -q "$ZIP_FILE" -d extracted_project
          
          # الدخول داخل المجلد المفكوك والبحث عن مكان الـ gradlew
          cd extracted_project
          
          # إذا كان الملف المضغوط يحتوي على مجلد رئيسي بداخله
          GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found inside the extracted files!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          
          echo "=== Building Debug APK ==="
          ./gradlew assembleDebug
          
          echo "=== Building Release AAB ==="
          ./gradlew bundleRelease
          
          # نسخ الملفات الناتجة لمجلد موحد للرفع
          mkdir -p ../../final-outputs
          find . -name "app-debug.apk" -exec cp {} ../../final-outputs/ \;
          find . -name "app-release.aab" -exec cp {} ../../final-outputs/ \;

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-and-aab
          path: final-outputs/*
